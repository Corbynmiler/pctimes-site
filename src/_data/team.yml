heading: Our people
intro: A small team, all locals, putting the paper together every week.
members:
  - name: Leanne Chamberlin
    role: Owner / Editor
    photo: /assets/images/leanne.jpg
    bio: |-
      After reporting for the PC Times for two years, Leanne stepped into the role of owner/editor in 2018 when the previous owners retired after 22 years.
      Leanne's background spans communications across corporate, nonprofit, healthcare and education sectors.
