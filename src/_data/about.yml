heading: About the Pōhutukawa Coast Times
lede: Locally owned, independently produced, and delivered free to your letterbox every week.
sections:
  - heading: Our story
    body: |-
      After more than 30 years in print, the Pōhutukawa Coast Times remains the only newspaper to cover the coastal and rural areas of south-east Auckland. We really are 'The Paper with the Most for the Coast.'

      We're an independent publication, and are proudly local. Our team takes pride in journalistic integrity and balanced reporting of local issues.
  - heading: What we cover
    body: Local news, community events, council updates, school news, sport, profiles of coast locals, public notices, and the businesses that keep the coast ticking.
