heading: About the Pōhutukawa Coast Times
lede: Locally owned, independently produced, and delivered free to your letterbox every week.
sections:
  - heading: Our story
    body: |-
      The Pōhutukawa Coast Times is the only newspaper to cover a unique circulation area which includes Beachlands, Maraetai, Whitford, Clevedon, Brookby, Kawakawa Bay, Ōrere Point, Hūnua, Paparimu, Alfriston and Ardmore.

      We're an independent publication, and are proudly local. Our team takes pride in journalistic integrity and balanced reporting of local issues. We really are 'the paper with the most for the Coast'.
  - heading: What we cover
    body: Local news, community events, council updates, school news, sport, profiles of coast locals, public notices, and the businesses that keep the coast ticking. If it matters to the coast, you'll find it in the PC Times.
  - heading: How to get involved
    body: |-
      Have a story tip, photo, letter to the editor, or community notice?
      [Submit a story](/submit/) or get in touch - we love hearing from readers.
team_note: Want to help deliver the paper? Send us an email to join our waiting list.
