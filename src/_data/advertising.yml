intro: The Pōhutukawa Coast Times reaches the letterboxes of more than 6,800 households and businesses — about 20,000 people — within the coastal and rural communities of south-east Auckland each week.
benefits:
  - Hyper-local focus - high readership and recall
  - Delivered to actual letterboxes - not left sitting in a rack
  - Flexible options, from classifieds to full-page display ads
  - Eyes linger longer on print!
classified_rate: $15 per 30 words
boxed_rate: $8 + GST per column centimetre - email your ad to us for pricing
display_rate_note: Display ad rates vary by size, placement and duration — see rate card.
