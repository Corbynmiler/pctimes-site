<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster — PC Times admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/admin/roster/roster.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a href="/admin/" class="topbar__back" aria-label="Back to the CMS editor">← CMS editor</a>
      <h1 class="topbar__title">📬 Roster <span class="pill pill--beta">Beta</span></h1>
      <span class="topbar__cms" aria-hidden="true" style="opacity:0.4">pctimes.co.nz</span>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="main" id="app">
    <div class="loading">Loading roster…</div>
  </main>

  <template id="tpl-slot-card">
    <article class="slot-card">
      <div class="slot-card__dates">
        <div class="slot-card__due">
          <div class="slot-card__dayNum"></div>
          <div class="slot-card__month"></div>
        </div>
        <div class="slot-card__pub"></div>
      </div>
      <div class="slot-card__body">
        <div class="slot-card__who">
          <strong class="slot-card__org"></strong>
          <span class="slot-card__contact"></span>
        </div>
        <div class="slot-card__meta">
          <span class="slot-card__status badge"></span>
          <span class="slot-card__email muted"></span>
        </div>
        <div class="slot-card__notes muted" hidden></div>
      </div>
      <div class="slot-card__actions"></div>
    </article>
  </template>

  <template id="tpl-draft-card">
    <article class="draft-card">
      <header class="draft-card__head">
        <div>
          <div class="draft-card__to">
            <span class="draft-card__to-label">To:</span>
            <strong class="draft-card__name"></strong>
            <span class="muted draft-card__email"></span>
          </div>
          <div class="draft-card__subject"></div>
        </div>
        <div class="draft-card__badges">
          <span class="badge badge--roster"></span>
          <span class="badge draft-card__status"></span>
        </div>
      </header>
      <div class="draft-card__body">
        <textarea class="draft-card__textarea" rows="8" spellcheck="true"></textarea>
      </div>
      <footer class="draft-card__actions"></footer>
    </article>
  </template>

  <div id="toast-host" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="/admin/roster/roster.js" type="module"></script>
</body>
</html>
